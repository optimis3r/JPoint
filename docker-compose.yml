version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: jpoint-minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
      - MINIO_NOTIFY_WEBHOOK_ENABLE_PRIMARY=on
      - MINIO_NOTIFY_WEBHOOK_ENDPOINT_PRIMARY=http://api-gateway:8000/api/v1/webhooks/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  redis:
    image: redis:alpine
    container_name: jpoint-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jpoint-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  api-gateway:
    build: ./api-gateway
    container_name: jpoint-api-gateway
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=jpoint-redis
    depends_on:
      - redis
      - minio

volumes:
  minio_data:
  redis_data: